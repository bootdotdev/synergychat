apiVersion: apps/v1
kind: Deployment
metadata:
  name: synergychat-web
  labels:
    app: synergychat-web
spec:
  selector:
    matchLabels:
      app: synergychat-web
  template:
    metadata:
      labels:
        app: synergychat-web
    spec:
      containers:
        - name: synergychat-web
          image: bootdotdev/synergychat-web:latest
          resources:
            limits:
              cpu: 50m
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
